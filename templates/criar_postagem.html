{% extends "base.html" %}

{% block content %}
<div class="login-container" style="max-width: 600px; margin: 40px auto;">
    <div class="login-box">
        <h2 style="color: #2c3e50; margin-bottom: 5px;"><i class="fas fa-edit"></i> Nova Publicação</h2>
        <p style="color: #64748b; margin-bottom: 20px;">Partilhe notícias, eventos ou alertas com a comunidade de Moçâmedes.</p>

        <form method="POST" action="/criar_postagem" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Categoria da Publicação</label>
                <select name="categoria" class="form-select" required style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px;">
                    <option value="Notícia">Notícia Local</option>
                    <option value="Evento">Evento / Convívio</option>
                    <option value="Alerta">Alerta de Utilidade Pública</option>
                    <option value="Discussão">Debate / Discussão</option>
                    <option value="Cultura">Cultura e Lazer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Título Breve</label>
                <input type="text" name="titulo" placeholder="Ex: Feira de Agricultura neste fim de semana" required style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px;">
            </div>

            <div class="form-group">
                <label>O que está a acontecer?</label>
                <textarea name="conteudo" rows="5" placeholder="Escreva os detalhes da sua publicação..." required style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; resize: vertical;"></textarea>
            </div>

            <div class="form-group" style="margin-top: 15px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1;">
                <label style="color: #334155; font-weight: bold;"><i class="fas fa-camera"></i> Anexar Fotos (Opcional - Máx 2)</label>
                <div style="display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap;">
                    <input type="file" name="imagem1" accept="image/*" style="flex: 1; min-width: 200px; padding: 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white;">
                    <input type="file" name="imagem2" accept="image/*" style="flex: 1; min-width: 200px; padding: 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white;">
                </div>
            </div>

            <button type="submit" style="width: 100%; background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 15px; transition: 0.3s;">
                Publicar no Feed
            </button>
        </form>
    </div>
</div>
{% endblock %}
