{% extends "base.html" %}

{% block content %}
<div class="admin-container" style="max-width: 600px; margin: 40px auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2><i class="fas fa-edit"></i> Editar Avaliação</h2>
        <a href="/detalhes/{{ av.diretorio_id }}" style="color: #64748b; font-weight: bold; text-decoration: none;"><i class="fas fa-arrow-left"></i> Cancelar</a>
    </div>

    <div class="admin-card" style="padding: 30px;">
        <p style="color: #64748b; margin-top: 0;">Você está editando sua avaliação para: <strong>{{ local.nome }}</strong></p>
        
        <form method="POST" action="/editar_avaliacao/{{ av.id }}">
            
            <div class="star-rating-form" style="margin-bottom: 20px; justify-content: center;">
                <input type="radio" id="star5" name="nota" value="5" {% if av.nota == 5 %}checked{% endif %} required/><label for="star5" title="5 estrelas"><i class="fas fa-star"></i></label>
                <input type="radio" id="star4" name="nota" value="4" {% if av.nota == 4 %}checked{% endif %} /><label for="star4" title="4 estrelas"><i class="fas fa-star"></i></label>
                <input type="radio" id="star3" name="nota" value="3" {% if av.nota == 3 %}checked{% endif %} /><label for="star3" title="3 estrelas"><i class="fas fa-star"></i></label>
                <input type="radio" id="star2" name="nota" value="2" {% if av.nota == 2 %}checked{% endif %} /><label for="star2" title="2 estrelas"><i class="fas fa-star"></i></label>
                <input type="radio" id="star1" name="nota" value="1" {% if av.nota == 1 %}checked{% endif %} /><label for="star1" title="1 estrela"><i class="fas fa-star"></i></label>
            </div>

            <div class="form-group full-width">
                <label>Seu Comentário</label>
                <textarea name="comentario" rows="5" class="form-textarea" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">{{ av.comentario }}</textarea>
            </div>

            <button type="submit" class="btn-submit full-width" style="background-color: #2563eb; font-size: 1.1rem; width: 100%;">
                <i class="fas fa-save"></i> Atualizar Avaliação
            </button>
        </form>
    </div>
</div>
{% endblock %}
