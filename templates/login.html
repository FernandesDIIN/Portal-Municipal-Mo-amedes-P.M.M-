{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2>Acesso ao Portal</h2>
        <p>Entre com seu e-mail e senha.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert-error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>E-mail ou Telefone</label>
                <input type="text" name="login_input" placeholder="seu@email.com OU 923..." required>
            </div>
            
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" required>
            </div>

            <button type="submit" class="btn-login-submit">Entrar</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <p>Ainda não tem conta?</p>
        <a href="/register" class="btn-register">Criar Conta de Cidadão</a>
    </div>
</div>

<style>
    /* Estilo rápido para o botão de registro */
    .btn-register {
        display: block;
        text-align: center;
        background-color: white;
        color: #2c3e50;
        border: 2px solid #2c3e50;
        padding: 10px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }
    .btn-register:hover {
        background-color: #2c3e50;
        color: white !important;
    }
</style>
{% endblock %}
